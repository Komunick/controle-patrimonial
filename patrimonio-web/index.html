<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Controle Patrimonial · Brazil Transports</title>
  <script>
    // Aplica o tema salvo ANTES da primeira pintura (evita o "flash" claro).
    // Sem preferência salva, segue o modo do sistema operacional.
    (function () {
      var tema = localStorage.getItem('patrimonio.tema');
      if (tema !== 'escuro' && tema !== 'claro') {
        tema = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ? 'escuro' : 'claro';
      }
      document.documentElement.dataset.tema = tema;
    })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png" />
  <link rel="apple-touch-icon" href="assets/favicon-180.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <img src="assets/logo.png" alt="Brazil Transports" />
        </div>
        <div class="brand-title">Controle Patrimonial</div>
        <div class="brand-sub">Brazil Transports</div>
      </div>
      <nav class="nav" id="nav"></nav>
      <button id="btn-tema" class="tema-btn" type="button">🌙 Modo escuro</button>
      <div class="operator" id="operator-box">
        <span class="op-label">Operador</span>
        <button class="op-name" id="operator-btn" title="Trocar operador">—</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
        <h1 id="page-title">Painel</h1>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <main class="view" id="view"></main>
      <footer class="app-footer">
        <span>Sistema de Controle Patrimonial</span>
        <span class="af-right">Brazil Transports · Asset Management</span>
      </footer>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <section class="drawer" id="drawer" aria-hidden="true">
    <header class="drawer-head">
      <h2 id="drawer-title">—</h2>
      <button class="icon-btn" id="drawer-close" aria-label="Fechar">✕</button>
    </header>
    <div class="drawer-body" id="drawer-body"></div>
  </section>

  <div class="toast-wrap" id="toast-wrap"></div>

  <script>
    // Alternância claro/escuro (preferência salva no navegador).
    (function () {
      var btn = document.getElementById('btn-tema');
      function pintar() {
        var escuro = document.documentElement.dataset.tema === 'escuro';
        btn.textContent = escuro ? '☀️ Modo claro' : '🌙 Modo escuro';
      }
      btn.addEventListener('click', function () {
        var novo = document.documentElement.dataset.tema === 'escuro' ? 'claro' : 'escuro';
        document.documentElement.dataset.tema = novo;
        localStorage.setItem('patrimonio.tema', novo);
        pintar();
      });
      pintar();
    })();
  </script>
  <script src="vendor/qrcode-generator.js" defer></script>
  <script src="vendor/xlsx.mini.min.js" defer></script>
  <script src="qr.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
